<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tasas de Cambio</title>

    <!-- Conecta la hoja de estilos (estilos.css) -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">

        <h1>Calculadora de Monedas</h1>

        <p class="descripcion">
            Convierte monedas utilizando tasas de cambio
        </p>

        <!-- Campo: cantidad a convertir -->
        <label for="cantidad">Cantidad:</label>
        <input
            type="number"
            id="cantidad"
            placeholder="Ingrese una cantidad"
            min="0"
            step="any"
            value="1"
        >

        <!-- Selector: moneda de origen -->
        <label for="monedaOrigen">Moneda de origen:</label>
        <select id="monedaOrigen">
            <option value="USD">USD - Dólar estadounidense</option>
            <option value="DOP">DOP - Peso dominicano</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - Libra esterlina</option>
            <option value="CAD">CAD - Dólar canadiense</option>
            <option value="MXN">MXN - Peso mexicano</option>
            <option value="COP">COP - Peso colombiano</option>
            <option value="JPY">JPY - Yen japonés</option>
        </select>

        <!-- Selector: moneda de destino -->
        <label for="monedaDestino">Moneda de destino:</label>
        <select id="monedaDestino">
            <option value="DOP">DOP - Peso dominicano</option>
            <option value="USD">USD - Dólar estadounidense</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - Libra esterlina</option>
            <option value="CAD">CAD - Dólar canadiense</option>
            <option value="MXN">MXN - Peso mexicano</option>
            <option value="COP">COP - Peso colombiano</option>
            <option value="JPY">JPY - Yen japonés</option>
        </select>

        <!-- Botones: convertir y actualizar la tasa -->
        <div class="botones">
            <button id="btnConvertir">
                Convertir
            </button>

            <button id="btnActualizar">
                Actualizar tasa
            </button>
        </div>

        <!-- Resultado de la conversión -->
        <div id="resultado" aria-live="polite">
            El resultado aparecerá aquí.
        </div>

        <!-- Información de la tasa y fecha de actualización -->
        <p id="informacionTasa"></p>

    </div>

    <!-- Conecta la lógica (script.js) -->
    <script src="script.js"></script>

</body>
</html>
